<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VapeOasis — мини-приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=20261010m">
</head>
<body>
<div id="fx"></div>
<div class="header">
  <img src="logo.svg" alt="VapeOasis">
  <div class="htitle">
    <h1>VapeOasis</h1>
    <p>Приветствуем вас в нашем вейп шопе</p>
  </div>
  <div class="theme-dots" id="themes" title="Тема оформления">
    <button class="theme-btn dot-oasis" data-theme="oasis" title="Оазис">🏝️</button>
    <button class="theme-btn dot-glacier" data-theme="glacier" title="Ледник">❄️</button>
    <button class="theme-btn dot-flame" data-theme="flame" title="Пламя">🔥</button>
    <button class="theme-btn dot-forest" data-theme="forest" title="Лес">🌲</button>
    <button class="theme-btn dot-neon" data-theme="neon" title="Нуар (фото на фоне)">🌌</button>
  </div>
</div>

<div class="steps"><span class="on">1 Каталог</span>→<span>2 Корзина</span>→<span>3 Готово</span></div>
<div class="deco" id="themeDeco"></div>

<div class="nav">
  <button class="tab active" data-nav="shop">🛍 Каталог</button>
  <button class="tab" data-nav="bonus">⭐ За бонусы</button>
  <button class="tab" data-nav="cab">👤 Кабинет</button>
</div>

<div id="shopView">
  <div class="tabs" id="cats"></div>
  <div class="filters">
    <select id="strength">
      <option value="all">Крепость: любая</option>
      <option value="extra">Extra Hard</option>
      <option value="hard">Hard</option>
      <option value="medium">Medium</option>
    </select>
    <select id="sort">
      <option value="pop">Сначала популярные</option>
      <option value="cheap">Дешевле</option>
      <option value="exp">Дороже</option>
    </select>
  </div>
  <div class="small" style="padding:0 14px" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="bonusView" style="display:none;padding:0 14px 120px">
  <h3>⭐ Купить за бонусы</h3>
  <p class="small">Выбери товар и оплати его накопленными бонусами (1 бонус = 1 ₽).</p>
  <div class="small" style="padding:0 0 10px" id="bonusCount"></div>
  <div class="grid" id="bonusGrid"></div>
</div>

<div id="cabView" style="display:none;padding:0 14px 120px">
  <h3>👤 Личный кабинет</h3>
  <div class="profile" id="profile">
    <div class="ava" id="profAva">👤</div>
    <div><b id="profName">Гость</b><br><span class="small" id="profSub"></span></div>
  </div>
  <div class="row"><span>⭐ Мои бонусы</span><b id="myBonus">0</b></div>
  <div class="small" id="myBonusExp" style="margin:-4px 0 8px"></div>
  <div class="row"><span>🎁 Бонус за друга</span><b id="refBonus">40</b></div>
  <button class="btn gold" id="refBtn" style="width:100%;color:#1A140D">📨 Пригласить друга</button>
  <p class="small" id="refLink"></p>
  <h3>🧾 История заказов</h3>
  <div id="history"><p class="small">Пока пусто.</p></div>
</div>

<div class="bottom">
  <div class="sum"><span id="cartInfo">Корзина пуста</span><br><b id="totalInfo"></b></div>
  <button class="btn ghost" id="openCart">🛒</button>
  <button class="btn gold" id="checkoutBtn">Оформить</button>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script src="products.js?v=20261010m"></script>
<script src="app.js?v=20261010m"></script>
</body>
</html>
